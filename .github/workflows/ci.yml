name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            compiler: g++
            cc: gcc
            cxx: g++
          - os: macos-latest
            compiler: clang++
            cc: clang
            cxx: clang++

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build build-essential

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake ninja

    - name: Create build directory
      run: mkdir -p build

    - name: Extract version from CMakeLists.txt
      id: version
      run: |
        VERSION=$(grep 'VERSION' CMakeLists.txt | head -1 | sed 's/.*VERSION \([0-9.]*\).*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Configure CMake
      working-directory: build
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
      run: cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON ..

    - name: Build
      working-directory: build
      run: cmake --build . --config Release -j $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)

    - name: Run unit and integration tests
      working-directory: build
      run: ctest --output-on-failure --verbose

    - name: Test main executable
      working-directory: build
      run: |
        ./dbgpass --version
        ./dbgpass --help

    - name: Prepare binaries for release
      working-directory: build
      run: |
        mkdir -p dbgpass-${{ matrix.os }}
        cp dbgpass dbgpass-${{ matrix.os }}/
        if [[ "${{ runner.os }}" == "Linux" ]]; then
          tar -czf dbgpass-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz dbgpass-${{ matrix.os }}/
        else
          tar -czf dbgpass-${{ steps.version.outputs.version }}-macos.tar.gz dbgpass-${{ matrix.os }}/
        fi

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ matrix.os }}
        path: build/*.tar.gz
        if-no-files-found: ignore

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: build/test_results.xml
        if-no-files-found: ignore

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Check for compilation warnings
      run: |
        # This is a placeholder for code quality checks
        echo "Code quality checks configured"

    - name: Verify build scripts are executable
      run: |
        chmod +x scripts/build.sh
        chmod +x scripts/build-macos.sh
        chmod +x run_tests.sh
        ls -la scripts/ run_tests.sh

  release:
    needs: [build, code-quality]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
    permissions:
      contents: write
      packages: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract version from CMakeLists.txt
      id: version
      run: |
        VERSION=$(grep 'VERSION' CMakeLists.txt | head -1 | sed 's/.*VERSION \([0-9.]*\).*/\1/')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT
    
    - name: Increment build number
      id: increment_version
      run: |
        CURRENT_VERSION=$(grep 'VERSION' CMakeLists.txt | head -1 | sed 's/.*VERSION \([0-9.]*\).*/\1/')
        
        # Check if version already has a build number (4 parts: X.Y.Z.BUILD)
        IFS='.' read -ra PARTS <<< "$CURRENT_VERSION"
        
        if [ ${#PARTS[@]} -eq 4 ]; then
          # Already has build number, increment it
          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=${PARTS[2]}
          BUILD=$((PARTS[3] + 1))
        else
          # No build number yet, start with .1
          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=${PARTS[2]}
          BUILD=1
        fi
        
        NEW_VERSION="$MAJOR.$MINOR.$PATCH.$BUILD"
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        
        # Escape dots for sed regex
        ESCAPED_CURRENT=$(printf '%s\n' "$CURRENT_VERSION" | sed -e 's/[\/&]/\\&/g')
        ESCAPED_NEW=$(printf '%s\n' "$NEW_VERSION" | sed -e 's/[\/&]/\\&/g')
        
        # Update CMakeLists.txt using a different delimiter to avoid issues with dots
        sed -i "s|project(dbgpass VERSION $ESCAPED_CURRENT)|project(dbgpass VERSION $ESCAPED_NEW)|" CMakeLists.txt
        
        # Verify the change was made
        if grep -q "$NEW_VERSION" CMakeLists.txt; then
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push origin main
        else
          echo "Error: Failed to update CMakeLists.txt"
          exit 1
        fi
        
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
    
    - name: Check if tag already exists
      id: check_tag
      run: |
        if git rev-parse "v${{ steps.increment_version.outputs.version }}" >/dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Create Release Tag
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "v${{ steps.increment_version.outputs.version }}" -m "Release v${{ steps.increment_version.outputs.version }}"
        git push --tags origin
    
    - name: Generate Release Notes
      id: release_notes
      run: |
        cat > release_notes.txt << 'RELEASE_EOF'
        ## dbgpass v${{ steps.increment_version.outputs.version }}
        
        ### What's New
        - Automated build and testing on Ubuntu and macOS
        - Cross-platform compilation support
        - Comprehensive test suite with GoogleTest
        
        ### Platform Support
        - ✅ Linux (Ubuntu/Debian)
        - ✅ macOS (Apple Silicon & Intel)
        - ✅ Windows (MSYS2/MinGW)
        
        ### Installation
        ```bash
        ./scripts/build.sh --tests
        ```
        
        See [README](README.md) for detailed installation instructions.
        
        ### Testing
        All tests pass on:
        - Ubuntu (latest)
        - macOS (latest, Apple Silicon native)
        RELEASE_EOF
        
        echo "notes<<EOF" >> $GITHUB_OUTPUT
        cat release_notes.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create GitHub Release
      if: steps.check_tag.outputs.exists == 'false'
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.increment_version.outputs.version }}
        name: Release v${{ steps.increment_version.outputs.version }}
        body_path: release_notes.txt
        draft: false
        prerelease: false
        files: |
          artifacts/binaries-ubuntu-latest/*.tar.gz
          artifacts/binaries-macos-latest/*.tar.gz
